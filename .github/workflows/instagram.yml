name: Instagram LAB · publicar fila

on:
  schedule:
    - cron: "7 * * * *"   # de hora em hora, aos 7 minutos (UTC)
  workflow_dispatch:
    inputs:
      id:
        description: "Publicar só este item da fila (opcional; precisa estar aprovado)"
        required: false
      seco:
        description: "Só conferir, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar o que venceu
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.seco }}" = "true" ]; then ARGS="$ARGS --seco"; fi
          if [ -n "${{ inputs.id }}" ]; then ARGS="$ARGS --id ${{ inputs.id }}"; fi
          node publicador/publicar.js $ARGS
      - name: Gravar resultado na fila
        if: always()
        run: |
          if ! git diff --quiet publicador/fila.json; then
            git config user.name "LAB Publicador"
            git config user.email "actions@users.noreply.github.com"
            git add publicador/fila.json
            git commit -m "Instagram: resultado da publicação"
            git push
          fi
